name: CI

# Skips doc-only changes and draft pull requests; marking a draft ready runs it.
on:
  push:
    branches: [main]
    paths-ignore: &skip
      - "*.md"
      - docs/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *skip

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Astro check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test built site
        run: npm test
